# Generated by Beeline — do not edit by hand
# Template version: dev — app: hello-beeline
# Changes here are overwritten the next time Beeline updates this repository.
name: Beeline build

on:
  push:
    branches: ["**"]

concurrency:
  group: beeline-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Required to exchange the workflow's OIDC token for the Beeline build role.
  id-token: write
  contents: read

env:
  BEELINE_APP: "hello-beeline"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the Beeline configuration is present
        # These are set on the repository by DevOps during onboarding. Without
        # them the push below fails deep inside the AWS CLI with a message that
        # says nothing about onboarding, so fail here instead.
        run: |
          missing=""
          [ -n "${{ vars.BEELINE_AWS_REGION }}" ] || missing="$missing BEELINE_AWS_REGION"
          [ -n "${{ vars.BEELINE_AWS_ROLE_ARN }}" ] || missing="$missing BEELINE_AWS_ROLE_ARN"
          [ -n "${{ vars.BEELINE_ECR_REGISTRY }}" ] || missing="$missing BEELINE_ECR_REGISTRY"
          if [ -n "$missing" ]; then
            echo "Beeline onboarding has not finished: missing repository variables:$missing"
            echo "These are set once the ECR provisioning step is approved and merged."
            exit 1
          fi

      # TEMPORARY debug — remove once the OIDC trust issue is resolved.
      # Prints the OIDC token claims so we can compare `sub`/`aud`/`iss`
      # against the transform-github role trust policy.
      - name: Show OIDC claims (debug)
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in 2) PAYLOAD="$PAYLOAD==";; 3) PAYLOAD="$PAYLOAD=";; esac
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, iss, repository, repository_owner, ref}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BEELINE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.BEELINE_AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push
        env:
          REGISTRY: ${{ vars.BEELINE_ECR_REGISTRY }}
        run: |
          IMAGE="$REGISTRY/$BEELINE_APP:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "Pushed $IMAGE"
